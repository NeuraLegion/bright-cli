name: CI / Automated testing

on:
  pull_request:
    branches:
      - '**'

concurrency:
  group: '${{ github.workflow }}-${{ github.ref }}'
  cancel-in-progress: true

jobs:
  install-deps:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install deps
        uses: ./.github/workflows/composite/npm

  test:
    runs-on: ubuntu-latest
    needs: install-deps
    strategy:
      fail-fast: false
      matrix:
        # Track the latest release of each supported major rather than a pinned
        # patch. Keep the majors in sync with the npm leg of test-cli.yml.
        node: ['24', '26']
        target: ['lint', 'format', 'test:unit', 'build']
        # lint / format / build are runtime-agnostic, so only the test target is
        # worth running across every supported runtime.
        exclude:
          - node: '26'
            target: 'lint'
          - node: '26'
            target: 'format'
          - node: '26'
            target: 'build'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install deps
        uses: ./.github/workflows/composite/npm
        with:
          version: ${{ matrix.node }}

      - name: Execute ${{ matrix.target }} npm script (Node.js ${{ matrix.node }})
        run: npm run ${{ matrix.target }} -- $JEST_ARGUMENTS

  # Stable aggregation gate. Branch protection should require this single
  # `test-all` context instead of the individual `test` matrix legs, whose
  # check-run names (e.g. `test (24, build)`, `test (26, test:unit)`) change
  # whenever the matrix axes (node version / target) change. Requiring the
  # per-leg names leaves PRs stuck on "Expected — Waiting for status to be
  # reported" after any matrix change. This job passes only if every `test`
  # matrix leg succeeds.
  test-all:
    if: ${{ always() }}
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Verify all test matrix legs passed
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "One or more 'test' matrix legs did not succeed: ${{ needs.test.result }}"
            exit 1
          fi
          echo "All 'test' matrix legs succeeded."
